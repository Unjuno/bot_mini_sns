openapi: 3.0.3
info:
  title: Common Micro SNS Interface
  version: 0.1.0
  description: >-
    Common HTTP/JSON contract for platform adapters. The canonical operation is
    /events; language examples expose the same operation at their documented
    local paths (Python adapter_app /webhook, PHP /server.php, TypeScript /,
    and Go /webhook).
paths:
  /events:
    post:
      summary: Receive one user input and return the required reply
      operationId: receiveEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundEvent'
      responses:
        '200':
          description: Reply generated by the fixed current flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundReply'
        '400':
          description: Invalid event
components:
  schemas:
    InboundEvent:
      type: object
      required: [platform, user_id, content_type]
      properties:
        platform:
          type: string
          description: Source integration name
          example: telegram
        user_id:
          type: string
          description: Platform user ID; internal use only
        content_type:
          type: string
          enum: [text, image, audio, video, file]
        text:
          type: string
        media_url:
          type: string
          format: uri
          nullable: true
    OutboundReply:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            type: object
            required: [type, text]
            properties:
              type:
                type: string
                enum: [text, image, audio, video, file]
              text:
                type: string
              media_url:
                type: string
                format: uri
                nullable: true
